<html lang="en"><head><script>/* Stand-in for Claude's artifact runtime, so pages built for claude.ai work on a plain website.
   - 'downloads' saves files with a normal browser download.
   - Every other capability (shared database, user, AI sampling...) answers null, which each page
     already treats as "not available here" and falls back to its local mode. */
(function () {
  if (window.claude && typeof window.claude.use === 'function') return;
  function toBlob(data, filename) {
    if (data instanceof Blob) return data;
    if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) return new Blob([data]);
    var type = /\.json$/i.test(filename) ? 'application/json' : 'text/plain';
    return new Blob([typeof data === 'string' ? data : JSON.stringify(data, null, 2)], { type: type });
  }
  var downloads = {
    save: function (opts) {
      opts = opts || {};
      var name = opts.filename || 'download';
      var url = URL.createObjectURL(toBlob(opts.data, name));
      var a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      return Promise.resolve({ ok: true });
    }
  };
  window.claude = {
    standalone: true,
    use: function (name) { return Promise.resolve(name === 'downloads' ? downloads : null); }
  };
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script>
/* =====================================================================
   MICRO/GFX — micrographics generation tool
   Architecture note: everything under "ENGINE" (util, model, tokens,
   fonts, generators, layout, render) is DOM-light and free of editor
   state, so it can be lifted into a Figma plugin (code.ts + ui.html)
   or an Electron renderer without changes. "EDITOR" and "UI" sections
   are browser-specific.
   ===================================================================== */
'use strict';

/* ---------------- ENGINE · util ---------------- */
const U = {
  uid(p = '') { return p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); },
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,

  clone: (o) => JSON.parse(JSON.stringify(o)),
  esc: (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'),
  hash(str) { let h = 2166136261 >>> 0; str = String(str); for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  rng(seed) { // mulberry32

  },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  download(name, data, mime = 'application/octet-stream') {

  },
  readFile(file, as = 'text') {

  blobToDataURL(blob) { return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); },
  ab2b64(buf) { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  b642ab(b64) { const s = atob(b64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b.buffer; },
  // units — internal unit is px @ 96 dpi
  toUnit(px, unit) { return unit === 'mm' ? px * 25.4 / 96 : unit === 'pt' ? px * 72 / 96 : unit === 'in' ? px / 96 : px; },
  fromUnit(v, unit) { return unit === 'mm' ? v * 96 / 25.4 : unit === 'pt' ? v * 96 / 72 : unit === 'in' ? v * 96 : v; },
  evalNum(str, cur = 0) { // "10*3", "+=5", "50%" of cur

    let m = str.match(/^([+\-*/])=(.+)$/); if (m) { const v = U.evalNum(m[2]); if (v == null) return null; return m[1] === '+' ? cur + v : m[1] === '-' ? cur - v : m[1] === '*' ? cur * v : cur / v; }
    if (/%$/.test(str)) { const v = parseFloat(str); return isNaN(v) ? null : cur * v / 100; }

  },
  roman(n) { n = Math.floor(n); if (n <= 0 || n > 39999) return String(n); const t = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, r] of t) while (n >= v) { s += r; n -= v; } return s; },
  alpha(n) { n = Math.floor(n); if (n <= 0) return ''; let s = ''; while (n > 0) { n--; s = String.fromCharCode(65 + n % 26) + s; n = Math.floor(n / 26); } return s; },
  pad(v, n, ch = '0') { const s = String(v); const neg = s[0] === '-'; const b = neg ? s.slice(1) : s; return (neg ? '-' : '') + b.padStart(n, ch); },
  fmtDate(d, f) {
    const p = (v, n = 2) => String(v).padStart(n, '0');
    const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return f.replace(/YYYY|YY|MMM|MM|DD|HH|mm|ss|WW/g, (k) => ({ YYYY: d.getFullYear(), YY: p(d.getFullYear() % 100), MMM: M[d.getMonth()], MM: p(d.getMonth() + 1), DD: p(d.getDate()), HH: p(d.getHours()), mm: p(d.getMinutes()), ss: p(d.getSeconds()),
      WW: p(Math.ceil((((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + new Date(d.getFullYear(), 0, 1).getDay() + 1) / 7)) })[k]);
  },
  parseCSV(text) {
    const delim = (text.split('\n')[0].match(/\t/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? '\t' : (text.split('\n')[0].includes(';') && !text.split('\n')[0].includes(',') ? ';' : ',');
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true; else if (c === delim) { row.push(cell); cell = ''; }

  },
  // geometry
  rotPt(x, y, cx, cy, deg) { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); const dx = x - cx, dy = y - cy; return [cx + dx * c - dy * s, cy + dx * s + dy * c]; },
  bboxOf(o) { // world-axis-aligned bbox incl. rotation
    if (!o.rot) return { x: o.x, y: o.y, w: o.w, h: o.h };

    const pts = [[o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h]].map(([x, y]) => U.rotPt(x, y, cx, cy, o.rot));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x = Math.min(...xs), y = Math.min(...ys); return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  },
  unionBox(boxes) { if (!boxes.length) return null; let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity; for (const b of boxes) { x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); } return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }; },
  intersects(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; },
  // RDP simplification
  simplify(pts, eps) {
    if (pts.length < 3) return pts;
    const d2 = (p, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1]; const l = dx * dx + dy * dy; if (!l) return Math.hypot(p[0] - a[0], p[1] - a[1]); let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l; t = U.clamp(t, 0, 1); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); };

/* ---------------- ENGINE · SVG path math (parse → absolute → transform) ---------------- */
const PathMath = {
  parse(d) {
    const toks = String(d).match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g) || [];

/* ---------------- ENGINE · minimal ZIP writer (store, no compression) ---------------- */
const Zip = {
  crcT: null,
  crc(b) { if (!Zip.crcT) { Zip.crcT = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; Zip.crcT[n] = c >>> 0; } } let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = Zip.crcT[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; },
  build(files) { // [{name, data:Uint8Array|string}]
    const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
    for (const f of files) {
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data; const name = enc.encode(f.name); const crc = Zip.crc(data);
      const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), name); off += 30 + name.length + data.length;
    }
    const csize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  },
};

  base(type, p = {}) {

/* ---------------- ENGINE · tokens (progressive numbering, dates, data merge) ----------------
   Syntax: {token:arg:arg}
   {n} {n:3}            counter = start + (index * step), padded
   {i} {i1}             raw 0-based / 1-based index
   {seq:lot} {seq:lot:5} named sequence
   {roman} {roman:lower} {alpha} {alpha:lower}   counter as roman / letters
   {date:YYYY-MM-DD} {exp:365:DD/MM/YYYY}         today / today + days
   {rand:4} {randa:6} {hex:4}                      seeded random digits / A-Z0-9 / hex
   {csv:Column} {col:Column}                       data-merge record (index → row)
   {doc} {name} {w} {h} {unit} {seed}
   {pick:A|B|C}                                    seeded pick
   {calc:n*10+5:4}                                 arithmetic on n / i
   \{ escapes a literal brace
------------------------------------------------------------------------------------------- */
const Tokens = {
  resolve(str, ctx) {
    if (str == null) return '';
    str = String(str);
    if (!str.includes('{')) return str;
    const doc = ctx.doc, idx = ctx.index || 0; const num = doc.numbering || { start: 1, step: 1, pad: 0 };
    const n = num.start + idx * num.step;
    const rnd = (salt) => U.rng(U.hash((ctx.obj ? ctx.obj.id : '') + '|' + idx + '|' + (doc.seed || 0) + '|' + salt));
    let salt = 0;
    return str.replace(/\\\{/g, '\u0001').replace(/\{([^{}]+)\}/g, (all, body) => {
      const parts = body.split(':'); const t = parts[0].trim(); const a = parts.slice(1); salt++;
      switch (t) {
        case 'n': return U.pad(n, +a[0] || num.pad || 0);
        case 'i': return U.pad(idx, +a[0] || 0);
        case 'i1': return U.pad(idx + 1, +a[0] || 0);
        case 'seq': { const s = (doc.sequences || []).find(q => q.name === a[0]); if (!s) return all; const v = s.start + idx * s.step; return (s.prefix || '') + U.pad(v, +a[1] || s.pad || 0) + (s.suffix || ''); }
        case 'roman': { const r = U.roman(a[1] ? +a[1] : n); return a[0] === 'lower' ? r.toLowerCase() : r; }
        case 'alpha': { const r = U.alpha(n); return a[0] === 'lower' ? r.toLowerCase() : r; }
        case 'date': return U.fmtDate(new Date(), a.join(':') || 'YYYY-MM-DD');
        case 'exp': { const d = new Date(); d.setDate(d.getDate() + (+a[0] || 0)); return U.fmtDate(d, a.slice(1).join(':') || 'YYYY-MM-DD'); }
        case 'rand': { const r = rnd(salt); let s = ''; for (let k = 0; k < (+a[0] || 4); k++) s += r.int(0, 9); return s; }
        case 'randa': { const r = rnd(salt); const C = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; let s = ''; for (let k = 0; k < (+a[0] || 4); k++) s += C[r.int(0, C.length - 1)]; return s; }
        case 'hex': { const r = rnd(salt); let s = ''; for (let k = 0; k < (+a[0] || 4); k++) s += '0123456789ABCDEF'[r.int(0, 15)]; return s; }
        case 'pick': { const opts = a.join(':').split('|'); return rnd(salt).pick(opts); }
        case 'csv': case 'col': { const d = doc.data; if (!d || !d.headers.length) return all; const ci = d.headers.indexOf(a[0]); if (ci < 0) return all; const row = d.rows[(ctx.dataRow != null ? ctx.dataRow : idx) % Math.max(1, d.rows.length)]; return row ? (row[ci] ?? '') : ''; }
        case 'calc': { const expr = a[0].replace(/\bn\b/g, n).replace(/\bi\b/g, idx); const v = U.evalNum(expr); return v == null ? all : U.pad(Math.round(v * 1000) / 1000, +a[1] || 0); }
        case 'doc': return doc.name; case 'name': return ctx.obj ? ctx.obj.name : '';
        case 'w': return ctx.obj ? U.round(U.toUnit(ctx.obj.w, doc.unit), 1) : ''; case 'h': return ctx.obj ? U.round(U.toUnit(ctx.obj.h, doc.unit), 1) : '';
        case 'unit': return doc.unit; case 'seed': return doc.seed;
        default: return all;
      }
    }).replace(/\u0001/g, '{');
  },
  // name pattern for batch rename: same syntax, index = order in selection
  list: [
    ['{n}', 'counter (start/step from Numbering)'], ['{n:3}', 'counter padded to 3'], ['{i} / {i1}', 'raw index 0/1-based'],
    ['{seq:lot}', 'named sequence'], ['{roman}', 'counter in roman numerals'], ['{alpha}', 'A, B … AA'],
    ['{date:DD/MM/YYYY}', 'today'], ['{exp:365:DD/MM/YYYY}', 'today + N days'], ['{rand:4}', 'seeded digits'],
    ['{randa:6}', 'seeded A–Z0–9'], ['{hex:4}', 'seeded hex'], ['{pick:A|B|C}', 'seeded pick'],
    ['{calc:n*10:4}', 'math on n / i'], ['{csv:Column}', 'data merge column'], ['{doc} {w} {h}', 'doc name, object size'],
  ],
};

const Fonts = {
  loaded: new Set(), failed: new Set(), local: [], uploaded: new Map(), // family -> {name, b64}
  listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } }); },
  isGoogle(f) { return GOOGLE_FONTS.some(g => g[0] === f); },
  googleURL(fam, axis) { return 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fam).replace(/%20/g, '+') + (axis ? ':wght@' + axis : '') + '&display=swap'; },
  ensure(family) {

  async queryLocal() {

  },
  all() {

      google: GOOGLE_FONTS.map(g => ({ family: g[0], cat: g[2] })),
      local: this.local.map(f => ({ family: f, cat: 'local' })),
      upload: [...this.uploaded.keys()].map(f => ({ family: f, cat: 'upload' })),

  fallback(fam) { const g = GOOGLE_FONTS.find(x => x[0] === fam); return g ? (g[2] === 'mono' || g[2] === 'pixel' ? 'monospace' : g[2] === 'serif' ? 'serif' : 'sans-serif') : 'sans-serif'; },

  _ctx: null,

/* ---------------- EDITOR · persistence (IndexedDB + File System Access) ---------------- */
const Store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('microgfx', 1);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' }); if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      r.onsuccess = () => { Store.db = r.result; res(); }; r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) { return new Promise((res, rej) => { const t = Store.db.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  allProjects() { return Store.tx('projects', 'readonly', s => s.getAll()); },
  async listProjects() { return (await Store.allProjects()).map(p => ({ id: p.id, name: p.name, demo: p.demo })); },
  getProject(id) { return Store.tx('projects', 'readonly', s => s.get(id)); },
  putProject(p) { p.updated = Date.now(); return Store.tx('projects', 'readwrite', s => s.put(p)); },
  delProject(id) { return Store.tx('projects', 'readwrite', s => s.delete(id)); },
  get(k) { return Store.tx('kv', 'readonly', s => s.get(k)); },
  set(k, v) { return Store.tx('kv', 'readwrite', s => s.put(v, k)); },
  del(k) { return Store.tx('kv', 'readwrite', s => s.delete(k)); },
};

const Projects = {
  create(name = 'New project') {
    const doc = Model.newDoc({ name: 'Untitled' });
    return { id: U.uid('p_'), name, folders: [], docs: [{ id: doc.id, name: doc.name, folder: null, updated: Date.now() }], docData: { [doc.id]: doc }, assets: [], components: [], gridPresets: [], updated: Date.now() };
  },
  folderPath(p, fid) { const parts = []; let f = p.folders.find(x => x.id === fid); let guard = 0; while (f && guard++ < 50) { parts.unshift(f.name); f = p.folders.find(x => x.id === f.parent); } return parts; },
  safe(s) { return String(s).replace(/[\\/:*?"<>|]+/g, '_').trim() || 'untitled'; },
};

const Disk = {
  supported() { return 'showDirectoryPicker' in window && !Platform.inFrame; },
  async handle(pid) { return Store.get('dir:' + pid); },
  async verify(h, ask = true) { const o = { mode: 'readwrite' }; if ((await h.queryPermission(o)) === 'granted') return true; if (ask && (await h.requestPermission(o)) === 'granted') return true; return false; },
  async link(p) { const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'microgfx' }); await Store.set('dir:' + p.id, h); return h.name; },
  async unlink(p) { await Store.del('dir:' + p.id); },
  async writeFile(dir, path, data) {
    const parts = path.split('/'); let d = dir; for (const seg of parts.slice(0, -1)) d = await d.getDirectoryHandle(seg, { create: true });
    const fh = await d.getFileHandle(parts[parts.length - 1], { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close();
  },
  async save(p, opts = {}) {
    const h = await Disk.handle(p.id); if (!h) throw new Error('No folder linked to this project.');
    if (!(await Disk.verify(h, opts.ask !== false))) throw new Error('Permission to write the folder was not granted.');
    await Disk.writeFile(h, 'project.mgx.json', JSON.stringify(p));
    for (const d of p.docs) {
      const data = p.docData[d.id]; if (!data) continue; const dir = Projects.folderPath(p, d.folder).map(Projects.safe).join('/');
      const base = (dir ? dir + '/' : '') + Projects.safe(d.name);
      await Disk.writeFile(h, 'docs/' + base + '.mgx.json', JSON.stringify(data));
      if (opts.svg) { try { await Disk.writeFile(h, 'svg/' + base + '.svg', Render.svg(U.clone(data), { physical: true })); } catch (e) { console.warn(e); } }
    }
    return h.name;
  },
  async open() {
    const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'microgfx' });
    let fh; try { fh = await h.getFileHandle('project.mgx.json'); } catch { throw new Error('This folder does not contain a project.mgx.json file.'); }
    const p = JSON.parse(await (await fh.getFile()).text()); await Store.set('dir:' + p.id, h); return p;
  },
};

const Batch = {

    sel.forEach((o, i) => { o.name = Tokens.resolve(pattern, { doc: App.doc, index: i, obj: o }); }); App.commit('Batch rename'); UI.status(`Renamed ${sel.length} objects`);
  },
  stepRepeatForm() {
    const s = this.sr, P = Panels, u = App.doc.unit; const set = (k) => (v) => { s[k] = v; };
    return h('div', {}, P.grid2(P.reg(Field.num(() => s.count, set('count'), { label: 'Total', min: 2, int: true })), P.reg(Field.num(() => s.cols, set('cols'), { label: 'Cols', min: 1, int: true }))),
      P.grid2(P.reg(Field.num(() => U.toUnit(s.gapX, u), (v) => s.gapX = U.fromUnit(v, u), { label: 'Gx' })), P.reg(Field.num(() => U.toUnit(s.gapY, u), (v) => s.gapY = U.fromUnit(v, u), { label: 'Gy' }))),
      P.grid2(P.reg(Field.bool(() => s.inc, set('inc'), 'Advance {n}')), P.reg(Field.num(() => s.step, set('step'), { label: 'by', int: true }))),
      h('button', { class: 'btn pri', onclick: () => this.stepRepeat() }, 'Repeat selection'), h('div', { class: 'hint' }, 'Each copy gets “Index +” so {n}, {seq}, {csv} tokens advance — perfect for label sheets.'));
  },
  stepRepeat() {
    const sel = App.topLevelSel(); if (!sel.length) return UI.toast('Select something to repeat', 'err'); const s = this.sr; const b = U.unionBox(sel.map(U.bboxOf)); const ids = sel.map(o => o.id);
    for (let k = 1; k < s.count; k++) { const c = k % s.cols, r = Math.floor(k / s.cols);
      for (const o of sel) { const cl = Model.reId(U.clone(o)); Model.translate(cl, c * (b.w + s.gapX), r * (b.h + s.gapY)); if (s.inc) cl.idx = (o.idx || 0) + k * s.step; cl.name = o.name + ' ' + (k + 1); const p = App.parentOf(o.id); (p ? p.children : App.doc.objects).push(cl); ids.push(cl.id); } }

    const css = E.fmt === 'png' || E.embed ? await Fonts.embedCSS([...Render.usedFonts(App.doc.objects)]) : '';
    for (let i = 0; i < n; i++) { const d = U.clone(App.doc); const svg = Render.svg(d, { index: i, dataRow: i, physical: App.settings.exportPhysical, ids: App.settings.exportIds, background: !E.transparent, embedCSS: css || undefined });
      const name = Projects.safe(Tokens.resolve(App.settings.batchName || '{doc}_{n:3}', { doc: App.doc, index: i })) ;
      if (E.fmt === 'png') { const blob = await IO.raster(svg, App.doc.w, App.doc.h, E.scale); files.push({ name: name + '.png', data: new Uint8Array(await blob.arrayBuffer()) }); } else files.push({ name: name + '.svg', data: svg }); }

    const lw = U.toUnit(App.doc.w, 'mm'), lh = U.toUnit(App.doc.h, 'mm'); if (lw > lh && pw < ph && Math.floor((pw - 2 * S.margin + S.gap) / (lw + S.gap)) < 1) [pw, ph] = [ph, pw];

    const ox = (pw - (cols * lw + (cols - 1) * S.gap)) / 2, oy = (ph - (rows * lh + (rows - 1) * S.gap)) / 2; return { pw, ph, lw, lh, cols, rows, ox, oy, per: cols * rows };

      pages.push(s + '</svg>');
    }
    return pages;
  },
  async sheetSVG() { const pages = await this.sheets(App.exportOpts.embed ? await Fonts.embedCSS([...Render.usedFonts(App.doc.objects)]) : ''); if (pages.length === 1) U.download(Projects.safe(App.doc.name) + '_sheet.svg', pages[0], 'image/svg+xml'); else U.download(Projects.safe(App.doc.name) + '_sheets.zip', Zip.build(pages.map((p, i) => ({ name: `sheet_${i + 1}.svg`, data: p })))); },

/* ---------------- import / export ---------------- */
const IO = {
  pick(accept, cb, multiple = true) { const i = h('input', { type: 'file', accept, multiple }); i.onchange = () => i.files.length && cb([...i.files]); i.click(); },
  fontFamilyFromFile(name) { return name.replace(/\.(ttf|otf|woff2?|)$/i, '').replace(/[-_]+/g, ' ').replace(/\b(Regular|Variable|VF)\b/gi, '').trim() || 'Custom font'; },
  async importFiles(files, opts = {}) {
    const placed = []; const at = opts.at;
    for (const f of files) {
      const n = f.name.toLowerCase();
      try {
        if (/\.(ttf|otf|woff2?)$/.test(n)) { const b64 = U.ab2b64(await U.readFile(f, 'ab')); const fam = this.fontFamilyFromFile(f.name); await Fonts.registerUpload(fam, b64); App.project.assets.push({ id: U.uid('a_'), type: 'font', name: f.name, family: fam, data: b64 }); UI.toast(`Font “${fam}” added (Uploaded)`); if (App.sel.length) App.updateSel({ font: fam }); continue; }
        if (n.endsWith('.svg') || f.type === 'image/svg+xml') { const txt = await U.readFile(f); const a = { id: U.uid('a_'), type: 'svg', name: f.name, data: txt }; App.project.assets.push(a); if (!opts.asAsset || opts.insert) placed.push(this.svgObject(txt, f.name)); continue; }
        if (f.type.startsWith('image/')) { const url = await U.readFile(f, 'dataurl'); const a = { id: U.uid('a_'), type: 'image', name: f.name, data: url }; App.project.assets.push(a); if (!opts.asAsset || opts.insert) placed.push(await this.imageObject(url, f.name)); continue; }
        if (n.endsWith('.json')) { const j = JSON.parse(await U.readFile(f)); if (j.docData) await this.addProject(j); else if (j.objects) this.addDoc(j); else UI.toast('Unknown JSON', 'err'); continue; }
        if (/\.(csv|tsv|txt)$/.test(n)) { Object.assign(App.doc.data, U.parseCSV(await U.readFile(f))); App.commit('Data'); UI.toast(`${App.doc.data.rows.length} records loaded into Data merge`); continue; }
        UI.toast('Unsupported file: ' + f.name, 'err');
      } catch (e) { console.error(e); UI.toast('Import failed: ' + f.name, 'err'); }
    }
    if (placed.length) Lib.place(placed, { at, label: 'Import' }); else { App.save(); Panels.refresh(); }
  },
  svgObject(txt, name = 'SVG') {
    const doc = new DOMParser().parseFromString(txt, 'image/svg+xml'); const root = doc.documentElement; if (!root || root.nodeName !== 'svg') throw new Error('Not an SVG');
    root.querySelectorAll('script').forEach(s => s.remove());
    let vb = root.getAttribute('viewBox'); const W = parseFloat(root.getAttribute('width')) || 0, H = parseFloat(root.getAttribute('height')) || 0;
    if (!vb) vb = `0 0 ${W || 100} ${H || 100}`; const p = vb.split(/[\s,]+/).map(Number); let w = W || p[2], h2 = H || p[3]; const max = Math.min(App.doc.w, App.doc.h) * 0.5; if (w > max || h2 > max) { const s = max / Math.max(w, h2); w *= s; h2 *= s; }
    return Model.create('svg', { markup: root.innerHTML, vb, w, h: h2, name: name.replace(/\.svg$/i, ''), keepRatio: true, fill: 'sw:ink' });
  },
  imageObject(url, name) { return new Promise((res) => { const im = new Image(); im.onload = () => { let w = im.naturalWidth, h2 = im.naturalHeight; const max = Math.min(App.doc.w, App.doc.h) * 0.6; if (w > max || h2 > max) { const s = max / Math.max(w, h2); w *= s; h2 *= s; } res(Model.create('image', { src: url, w, h: h2, name: name.replace(/\.\w+$/, ''), lockRatio: true })); }; im.onerror = () => res(Model.create('image', { src: url, w: 200, h: 200, name })); im.src = url; }); },
  async insertAsset(a) { if (a.type === 'svg') Lib.place([this.svgObject(a.data, a.name)]); else if (a.type === 'image') Lib.place([await this.imageObject(a.data, a.name)]); },
  addDoc(d) { d.id = U.uid('d_'); Model.migrate(d); App.project.docData[d.id] = d; App.project.docs.push({ id: d.id, name: d.name, folder: null }); App.openDoc(d.id); App.save(); Panels.refresh(); UI.toast(`Imported “${d.name}”`); },
  async addProject(p) { const ex = await Store.getProject(p.id); if (ex) p.id = U.uid('p_'), p.name += ' (imported)'; await Store.putProject(p); await App.openProject(p); Panels.refresh(); UI.toast(`Project “${p.name}” imported`); },
  svgFor(opts = {}) {
    const E = App.exportOpts || {}; const scopeSel = (opts.scope || E.scope) === 'sel' && App.sel.length;
    const d = U.clone(App.doc); Layout.run(d, d.previewIndex || 0);
    const o = { index: d.previewIndex || 0, dataRow: d.previewIndex || 0, physical: App.settings.exportPhysical, ids: App.settings.exportIds, background: !E.transparent && !scopeSel, embedCSS: opts.css };
    if (scopeSel) { const ids = new Set(App.topLevelSel().map(q => q.id)); const objs = []; Model.walk(d.objects, (q) => { if (ids.has(q.id)) { objs.push(q); return; } }); o.objects = objs; o.bounds = U.unionBox(objs.map(U.bboxOf)); }
    return { svg: Render.svg(d, o), w: o.bounds ? o.bounds.w : d.w, h: o.bounds ? o.bounds.h : d.h };
  },
  async exportSVG(scope) { const E = App.exportOpts || {}; const css = E.embed ? await Fonts.embedCSS([...Render.usedFonts(App.doc.objects)]) : undefined; const r = this.svgFor({ scope, css }); U.download(Projects.safe(App.doc.name) + (scope === 'sel' || E.scope === 'sel' ? '_selection' : '') + '.svg', r.svg, 'image/svg+xml'); UI.status('SVG exported'); },
  async copySVG(scope) { const r = this.svgFor({ scope }); try { await navigator.clipboard.writeText(r.svg); App._lastCopySVG = r.svg; UI.toast('SVG copied — paste it in Figma (⌘/Ctrl+V)'); } catch (e) { UI.toast('Clipboard blocked — use Download SVG', 'err'); } },
  raster(svg, w, h2, scale) { return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h2 * scale); const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(b), 'image/png'); }; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/width="[^"]*mm"/, `width="${w}"`).replace(/height="[^"]*mm"/, `height="${h2}"`)); }); },
  async exportPNG(scope) {
    const E = App.exportOpts || { scale: 2 }; UI.status('Embedding fonts…'); const css = await Fonts.embedCSS([...Render.usedFonts(App.doc.objects)]);
    const r = this.svgFor({ scope, css }); const svg = r.svg.replace(/(<svg[^>]*?) width="[^"]*" height="[^"]*"/, `$1 width="${r.w}" height="${r.h}"`);
    try { const blob = await this.raster(svg, r.w, r.h, E.scale || 2); U.download(Projects.safe(App.doc.name) + `@${E.scale || 2}x.png`, blob); UI.status('PNG exported'); } catch (e) { UI.toast('PNG export failed', 'err'); }
  },
  exportJSON() { App.flushDoc(); U.download(Projects.safe(App.doc.name) + '.mgx.json', JSON.stringify(App.doc, null, 1), 'application/json'); },
  printPages(pages, pw, ph) {
    const fams = [...Render.usedFonts(App.doc.objects)]; const links = fams.filter(f => Fonts.isGoogle(f)).map(f => { const g = GOOGLE_FONTS.find(x => x[0] === f); return `<link rel="stylesheet" href="${Fonts.googleURL(f, g[1])}">`; }).join('');
    const up = fams.filter(f => Fonts.uploaded.has(f)).map(f => `@font-face{font-family:"${f}";src:url(data:font/ttf;base64,${Fonts.uploaded.get(f).b64})}`).join('');
    const page = `<!doctype html><html><head><title>${U.esc(App.doc.name)} — print</title>${links}<style>${up}@page{size:${pw}mm ${ph}mm;margin:0}html,body{margin:0;padding:0}.pg{width:${pw}mm;height:${ph}mm;page-break-after:always;overflow:hidden}.pg svg{display:block}</style></head><body>${pages.map(p => `<div class="pg">${p}</div>`).join('')}<script>document.fonts.ready.then(()=>setTimeout(()=>print(),400))<\/script></body></html>`;
    if (Platform.inFrame) { U.download(Projects.safe(App.doc.name) + '_print.html', page, 'text/html'); UI.toast('Printing is blocked inside Claude — open the downloaded page to print or save as PDF'); return; }
    const w = window.open('', '_blank'); if (!w) return UI.toast('Pop-up blocked — allow pop-ups to print', 'err'); w.document.write(page); w.document.close();
  },
  exportPDF() { const d = App.doc; const r = this.svgFor({ scope: 'doc' }); const pw = U.toUnit(d.w, 'mm'), ph = U.toUnit(d.h, 'mm'); this.printPages([r.svg.replace(/(<svg[^>]*?) width="[^"]*" height="[^"]*"/, `$1 width="${pw}mm" height="${ph}mm"`)], pw, ph); },
  bindDropPaste() {
    const st = Canvas.el.stage;
    st.addEventListener('dragover', e => { e.preventDefault(); st.classList.add('drop'); }); st.addEventListener('dragleave', () => st.classList.remove('drop'));

      const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return; e.preventDefault();

      if (App.clipboard) App.paste();
    });
  },
};

/* ---------------- scripting ---------------- */
const Script = {
  doc: `api.doc            current document (mutable)
api.add(type, props, parentId?)   create object (types: rect ellipse line polygon star path text image svg frame group + generators: ${Object.keys(Gen).join(' ')})
api.frame(props, children[])      auto-layout frame
api.get(id) / api.all() / api.selected() / api.find(fn)
api.select(ids) / api.remove(id)
api.grid.columns() / rows() / content()      grid geometry (px)
api.rand(seed)     seeded rng: r(), r.int(a,b), r.pick(arr), r.bool(p)
api.mm(v) / api.px(v)   unit helpers (mm → px, px → mm)
api.swatch(id, color)   set swatch color (ink, paper, accent)
api.icons          icon names
api.commit(label)  (called automatically after run)
log(...)           print here`,
  run(code, log) {
    const created = [];
    const api = {
      doc: App.doc, app: App, U, Model, Tokens, Gen, icons: Object.keys(ICONS),
      add(type, props = {}, parentId) { const o = Model.create(type, props); if (!o.name) o.name = App.autoName(o); Model.walk([o], x => x.font && Fonts.ensure(x.font)); const p = parentId ? App.get(parentId) : null; (p ? p.children : App.doc.objects).push(o); App.reindex(); created.push(o.id); return o; },
      frame(props = {}, children = []) { children.forEach(c => Model.remove(App.doc, c.id)); const f = Model.create('frame', Object.assign({ layout: 'row', hugW: true, hugH: true }, props, { children })); f.name = f.name || App.autoName(f); App.doc.objects.push(f); App.reindex(); created.push(f.id); return f; },
      get: (id) => App.get(id), all: () => { const a = []; Model.walk(App.doc.objects, o => { a.push(o); }); return a; }, selected: () => App.selected(), find: (fn) => { const a = []; Model.walk(App.doc.objects, o => { if (fn(o)) a.push(o); }); return a; },
      select: (ids) => App.select(ids), remove: (id) => { Model.remove(App.doc, id); App.reindex(); },
      grid: { columns: () => Grid.columns(App.doc), rows: () => Grid.rows(App.doc), content: () => Grid.content(App.doc) },
      rand: (s) => U.rng(s ?? App.doc.seed), mm: (v) => U.fromUnit(v, 'mm'), px: (v) => U.toUnit(v, 'mm'),
      swatch: (id, c) => { const s = App.doc.swatches.find(q => q.id === id); if (s) s.color = c; }, commit: (l) => App.commit(l || 'Script'),
    };
    const lg = (...a) => log(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));
    try { const r = new Function('api', 'log', '"use strict";\n' + code)(api, lg); Promise.resolve(r).then(() => { App.reindex(); if (created.length) App.sel = created; App.commit('Script'); lg(`✓ done (${created.length} created)`); }).catch(e => lg('✗ ' + e.message)); }
    catch (e) { lg('✗ ' + e.message); }
  },
};

const Platform = {
  inFrame: (() => { try { return window.self !== window.top; } catch { return true; } })(),
  db: null, uid: null, downloads: null, mode: 'local',
  async init() {
    for (let i = 0; i < 10 && !(window.claude && typeof window.claude.use === 'function'); i++) await new Promise(r => setTimeout(r, 100));
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    const to = (p, ms) => Promise.race([Promise.resolve(p).catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
    const [db, user, dl] = await Promise.all([to(window.claude.use('db'), 9000), to(window.claude.use('user'), 9000), to(window.claude.use('downloads'), 9000)]);
    this.downloads = dl || null;
    if (db && user && user.id) { const id = await to(user.id(), 6000); if (id) { this.db = db; this.uid = id; this.mode = 'cloud'; } }
  },
