<style>
/* Layout: a bench of five vector monitors in a 3-col grid (terrain spans 2), each a live canvas over its own parameter rack; one CRT rack governs all screens. Deliberately single dark theme. */
:root{
  --bg:#060709; --panel:#0b0c10; --rule:#20232b; --rule-hi:#3a3f4c; --black:#000;
  --fg:#d8dae3; --dim:#737889;
  --red:#ff3d2e; --orange:#ff8a3d; --mint:#3df0b4; --phos:#ece8ff; --violet:#9a80ff; --blue:#6aa8ff;
  --yellow:#ffd23a; --cyan:#3fd8ff; --green:#4fe07a; --magenta:#e050ff; --amber:#ffb43a; --lime:#c6ff3d;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --scan:.55; --vig:.6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--mono);font-size:12px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.led{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
body.paused .led{background:var(--orange);box-shadow:0 0 8px var(--orange)}
h1{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(36px,5.4vw,60px);line-height:.88;letter-spacing:.015em;text-transform:uppercase;color:var(--red);text-shadow:0 0 22px rgba(255,61,46,.45);text-wrap:balance}
h1 span{color:var(--phos);text-shadow:0 0 22px rgba(236,232,255,.3)}
.tele{display:flex;gap:22px;margin:0}
.tele div{display:flex;flex-direction:column;gap:3px}
.tele dt{font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.tele dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:7ch}
.acts{--acc:var(--red);display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn,.tog{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--rule-hi);padding:7px 9px;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn:hover,.tog:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{background:var(--rule)}
.btn.big{padding:10px 13px}
.tog::before{content:"[ ] ";white-space:pre}
.tog[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.tog[aria-pressed="true"]::before{content:"[\25A0] "}
:focus-visible{outline:1px dashed var(--acc,var(--mint));outline-offset:2px}

/* ---------- CRT rack ---------- */
.crtrack{--acc:var(--mint);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 22px;align-items:center;border:1px solid var(--rule);padding:12px 14px;background:var(--panel)}
.crtrack .lbl{display:flex;flex-direction:column;gap:6px}
.crtrack .lbl span{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.crtrack .rack{grid-template-columns:repeat(4,minmax(0,1fr))}
body.crt-off .crtrack .rack{opacity:.35;pointer-events:none}
@media (max-width:760px){
  .crtrack{grid-template-columns:1fr auto}
  .crtrack .rack{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));order:3}
}

/* ---------- channel strip ---------- */
.strip{--acc:var(--mint);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border:1px solid var(--rule);background:var(--panel);padding:10px 14px}
.strip .lbl{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.sacts{display:flex;gap:6px}
.chip{font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--rule-hi);background:transparent;color:var(--dim);cursor:pointer;border-radius:2px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--rule-hi);flex:none}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.chip[aria-pressed="true"] i{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.panel.off .screen canvas{opacity:.4}
.panel.off .ov.tl::after{content:" \00B7  stopped";color:var(--dim)}

/* ---------- bench ---------- */
.bench{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense;gap:14px}
.wide{grid-column:span 2}
.full{grid-column:1/-1}
@media (max-width:1040px){.bench{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:660px){.bench{grid-template-columns:minmax(0,1fr)}.wide{grid-column:auto}}

.panel{background:var(--panel);border:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{margin:0;font-family:var(--display);font-weight:800;font-size:18px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);padding:4px 9px 3px;display:inline-flex;align-items:baseline;gap:8px;text-shadow:0 0 10px var(--acc)}
.tag .tri{font-size:11px}
.tag small{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--dim);text-shadow:none}
.pb{display:flex;gap:6px;flex-wrap:wrap}

.screen{position:relative;background:var(--black);border-radius:14px;overflow:hidden;aspect-ratio:1/1;max-width:100%;
  box-shadow:0 0 0 1px var(--rule-hi),0 0 0 5px #0e0f14,0 0 0 6px var(--rule)}
.wide .screen{aspect-ratio:2/1}
.full .screen{aspect-ratio:21/9}
@media (max-width:660px){.wide .screen,.full .screen{aspect-ratio:4/3}}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(to bottom,transparent 0 1px,rgba(0,0,0,calc(var(--scan)*.6)) 1px 3px)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;
  box-shadow:inset 0 0 calc(var(--vig)*80px) calc(var(--vig)*16px) rgba(0,0,0,calc(.25 + var(--vig)*.6));
  background:radial-gradient(130% 90% at 50% -10%,rgba(255,255,255,calc(var(--vig)*.06)),transparent 45%)}
body.crt-off .screen::before,body.crt-off .screen::after{display:none}
.ov{position:absolute;z-index:4;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 6px var(--acc);pointer-events:none;font-variant-numeric:tabular-nums}
.ov.tl{top:11px;left:13px}
.ov.bl{bottom:10px;left:13px;right:13px;display:flex;flex-wrap:wrap;gap:2px 14px}

@keyframes flick{0%,100%{opacity:1}6%{opacity:.9}7%{opacity:1}38%{opacity:.95}39%{opacity:1}71%{opacity:.87}72%{opacity:.98}73%{opacity:1}}
body.flicker:not(.crt-off) .screen canvas{animation:flick 2.9s steps(1) infinite}
@media (prefers-reduced-motion:reduce){body.flicker .screen canvas{animation:none}}

/* ---------- sliders ---------- */
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px 16px}
.full .rack{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wide .rack{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:baseline;min-width:0}
.ctl .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl output{font-size:11.5px;color:var(--acc);font-variant-numeric:tabular-nums}
.ctl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--acc) var(--p),var(--rule-hi) var(--p))}
input[type=range]::-moz-range-track{height:2px;background:var(--rule-hi)}
input[type=range]::-moz-range-progress{height:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:14px;margin-top:-6px;background:var(--panel);border:1.5px solid var(--acc);border-radius:1px;box-shadow:0 0 6px var(--acc)}
input[type=range]::-moz-range-thumb{width:6px;height:12px;background:var(--panel);border:1.5px solid var(--acc);border-radius:1px;box-shadow:0 0 6px var(--acc)}
input[type=range]:focus-visible{outline-offset:4px}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;border-top:1px solid var(--rule);padding-top:12px;color:var(--dim);font-size:10.5px;letter-spacing:.08em}
</style>

<div class="wrap">
  <header class="top">

</div>

<script>
(()=>{
const TAU=Math.PI*2;

/* ---------- utilities ---------- */

}
const hash=i=>{const s=Math.sin(i*12.9898+78.233)*43758.5453;return s-Math.floor(s)};
const pad=(n,w=2)=>String(n).padStart(w,'0');
function glow(ctx,color,k=1){if(G.crt&&G.bloom>0){ctx.shadowColor=color;ctx.shadowBlur=G.bloom*11*k}else ctx.shadowBlur=0}
function rr(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
/* ---------- 3D helpers (y up; yaw about Y, then pitch about X; z toward viewer) ---------- */
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function camera(w,h,o){
  const cy=Math.cos(o.yaw),sy=Math.sin(o.yaw),cp=Math.cos(o.pitch),sp=Math.sin(o.pitch),X=w/2+(o.ox||0),Y=h/2+(o.oy||0),s=o.scale,pe=o.persp||0;
  return(x,y,z)=>{const x1=x*cy+z*sy,z1=-x*sy+z*cy,y1=y*cp-z1*sp,z2=y*sp+z1*cp,f=1/Math.max(.25,1-pe*z2);return[X+x1*s*f,Y-y1*s*f,f]};
}

  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,ca=Math.cos(a)*r,sa=Math.sin(a)*r;
    const q=axis==='y'?pj(c[0]+ca,c[1],c[2]+sa):axis==='x'?pj(c[0],c[1]+ca,c[2]+sa):pj(c[0]+ca,c[1]+sa,c[2]);
    i?path.lineTo(q[0],q[1]):path.moveTo(q[0],q[1])}}
function box3(path,pj,sx,sy=sx,sz=sx){
  const v=[];for(const x of[-sx,sx])for(const y of[-sy,sy])for(const z of[-sz,sz])v.push(pj(x,y,z));

const noiseTile=document.createElement('canvas');noiseTile.width=noiseTile.height=128;
{const c=noiseTile.getContext('2d'),d=c.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}c.putImageData(d,0,0)}

/* ---------- slider factory ---------- */
const fmt=(p,v)=>p.f?p.f(v):v.toFixed(p.d??2);
function makeSlider(parent,id,p,onChange){
  const lab=document.createElement('label');lab.className='ctl';
  const step=p.step??0.01;
  lab.innerHTML=`<span class="k">${p.label}</span><output></output><input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${step}" value="${p.v}">`;
  const inp=lab.querySelector('input'),out=lab.querySelector('output');
  const sync=()=>{const v=+inp.value;out.textContent=fmt(p,v);inp.style.setProperty('--p',((v-p.min)/(p.max-p.min)*100)+'%')};
  inp.addEventListener('input',()=>{sync();onChange(+inp.value)});
  sync();parent.appendChild(lab);
  return{set(v){inp.value=v;sync();onChange(+inp.value)}};
}

/* ---------- module framework ---------- */
const bench=document.getElementById('bench');
let RUN_OFF=new Set();try{RUN_OFF=new Set(JSON.parse(localStorage.getItem('phosphor-run')||'[]'))}catch(e){}
function setRun(m,on,quiet){m.on=on;m.el.classList.toggle('off',!on);m.runBtn.setAttribute('aria-pressed',String(on));if(m.chip)m.chip.setAttribute('aria-pressed',String(on));m.dirty=true;
  if(!quiet){try{localStorage.setItem('phosphor-run',JSON.stringify(modules.filter(x=>!x.on).map(x=>x.id)))}catch(e){}}}
const modules=[];
function defineModule(def){
  const m=Object.assign({t:0,visible:true,dirty:true,w:0,h:0,stats:{},sliders:{}},def);
  m.P={};def.params.forEach(p=>m.P[p.k]=p.v);
  const el=document.createElement('section');
  el.className='panel p-'+def.id+(def.wide?' wide':'')+(def.full?' full':'');el.style.setProperty('--acc',def.acc);

    <div class="pb"><button class="tog" type="button" data-a="run" aria-pressed="true">Run</button><button class="btn" type="button" data-a="solo">Solo</button>${(def.extra||[]).map((x,i)=>`<button class="btn" type="button" data-x="${i}">${x.label}</button>`).join('')}<button class="btn" type="button" data-a="rand">Randomize</button><button class="btn" type="button" data-a="reset">Reset</button></div></header>
    <div class="screen"><canvas></canvas><div class="ov tl">${def.ch}</div><div class="ov bl"></div></div>

defineModule({
  id:'terrain',name:'Terrain',code:'T-01/RDG',ch:'CH1 · Ridge field',acc:'var(--phos)',wide:true,
  params:[

    {k:'freq',label:'Frequency',min:.5,max:4,v:1.8},
    {k:'octaves',label:'Octaves',min:1,max:6,step:1,v:5,d:0},
    {k:'ridge',label:'Ridge',min:0,max:1,v:.65},
    {k:'rows',label:'Scan lines',min:12,max:72,step:1,v:44,d:0},
    {k:'tilt',label:'Tilt',min:.3,max:.9,v:.52},
    {k:'spin',label:'Spin rad/s',min:-.6,max:.6,v:.12},
    {k:'drift',label:'Drift',min:0,max:1,v:.25},

  init(m){m.seed=0x5eed31;m.noise=makeNoise(m.seed)},
  draw(m,ctx,w,h,t){

    if(!m.hs||m.hs.length!==N*M)m.hs=new Float32Array(N*M);
    const hs=m.hs;let peak=0,pi=0;
    for(let r=0;r<N;r++){const z=-1+2*r/(N-1);
      for(let c=0;c<M;c++){const x=-1+2*c/(M-1),i=r*M+c,fall=Math.max(0,1-(x*x+z*z)*.9);

    ctx.globalAlpha=.95;ctx.lineWidth=1.4;
    const frame=s=>{ctx.beginPath();[[-s,-s],[s,-s],[s,s],[-s,s]].forEach(([x,z],i)=>{const[px,py]=pr(x,z,0);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();ctx.stroke()};
    frame(1);ctx.setLineDash([10,5]);ctx.globalAlpha=.6;frame(1.1);ctx.setLineDash([]);
    ctx.shadowBlur=0;ctx.strokeStyle=C.phos;ctx.globalAlpha=.5;ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){const[px,py]=pr(-1+i*.25,-1+j*.25,0);ctx.moveTo(px-2.5,py);ctx.lineTo(px+2.5,py);ctx.moveTo(px,py-2.5);ctx.lineTo(px,py+2.5)}

    for(let b=0;b<3;b++){ctx.globalAlpha=alp[b];ctx.strokeStyle=cols[b];glow(ctx,cols[b],b===2?1:.6);ctx.stroke(bins[b])}

  },

   CH2 — TORUS  (rainbow point cloud, ring → horn → spindle)
   ========================================================= */
defineModule({
  id:'torus',name:'Torus',code:'P-02/TOR',ch:'CH2 · Point cloud',acc:'var(--violet)',
  params:[
    {k:'points',label:'Points',min:2000,max:24000,step:500,v:14000,regen:1,f:v=>(v/1000).toFixed(1)+'k'},
    {k:'tube',label:'Tube r/R',min:.2,max:1.6,v:.92,regen:1},
    {k:'twist',label:'Twist',min:0,max:6,step:1,v:0,d:0,regen:1},
    {k:'hue',label:'Hue span',min:60,max:360,step:10,v:300,d:0,regen:1,f:v=>v+'°'},
    {k:'spinx',label:'Spin X',min:0,max:1,v:.16},
    {k:'spiny',label:'Spin Y',min:0,max:1,v:.3},
    {k:'size',label:'Point size',min:.6,max:3,v:1.3},
    {k:'persp',label:'Perspective',min:0,max:1,v:.5},
  ],
  init(m){m.needsGen=true},
  gen(m){
    const P=m.P,n=P.points|0,r=P.tube,tw=P.twist|0,span=P.hue,B=40;
    const nu=Math.max(8,Math.round(Math.sqrt(n*1.7))),nv=Math.max(4,Math.round(n/nu));
    const L=Array.from({length:B},()=>[]);
    for(let i=0;i<nu;i++){const u=i/nu*TAU,cu=Math.cos(u),su=Math.sin(u);
      for(let j=0;j<nv;j++){const v=j/nv*TAU+tw*u,cv=Math.cos(v),b=Math.min(B-1,Math.floor((cv+1)/2*B));
        L[b].push((1+r*cv)*cu,(1+r*cv)*su,r*Math.sin(v))}}
    m.buckets=L.map((l,b)=>({col:`hsl(${(b/(B-1)*span).toFixed(1)},100%,${56+b/(B-1)*8}%)`,d:new Float32Array(l)}));
    m.count=nu*nv;m.ext=1+r;m.needsGen=false;
  },
  draw(m,ctx,w,h,t){
    if(m.needsGen)this.gen(m);
    const P=m.P;
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.6);g.addColorStop(0,'rgba(90,50,170,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    const s=Math.min(w,h)*.4/m.ext,ax=.95+t*P.spinx*1.1,ay=t*P.spiny*1.1,cxa=Math.cos(ax),sxa=Math.sin(ax),cya=Math.cos(ay),sya=Math.sin(ay);
    const W2=w/2,H2=h/2,pe=P.persp*.42/m.ext,sz0=P.size;
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.62;
    for(const b of m.buckets){ctx.fillStyle=b.col;const d=b.d;
      for(let k=0;k<d.length;k+=3){const x=d[k],y=d[k+1],z=d[k+2];
        const y1=y*cxa-z*sxa,z1=y*sxa+z*cxa,x2=x*cya+z1*sya,z2=-x*sya+z1*cya;
        const f=1+pe*z2,sz=sz0*(.5+.5*f);ctx.fillRect(W2+x2*s*f-sz/2,H2+y1*s*f-sz/2,sz,sz)}}
  },
  readout:m=>{const r=m.P.tube,cls=Math.abs(r-1)<.04?'Horn':r<1?'Ring':'Spindle';
    return`<span>N ${(m.count||0).toLocaleString('en-US')}</span><span>r/R ${r.toFixed(2)}</span><span>${cls} torus</span>`}
});

defineModule({
  id:'scope',name:'Smith scope',code:'S-03/Γ',ch:'CH3 · Reflection plane',acc:'var(--red)',
  params:[
    {k:'rings',label:'R circles',min:2,max:10,step:1,v:6,d:0},
    {k:'arcs',label:'X arcs',min:2,max:10,step:1,v:5,d:0},
    {k:'fa',label:'Freq X',min:1,max:7,step:1,v:3,d:0},
    {k:'fb',label:'Freq Y',min:1,max:7,step:1,v:2,d:0},
    {k:'phase',label:'Phase drift',min:0,max:2,v:.35},
    {k:'amp',label:'Amplitude',min:.1,max:1,v:.8},
    {k:'persist',label:'Persistence',min:.1,max:1,v:.55},
    {k:'pitch',label:'Dot pitch',min:10,max:30,step:1,v:18,d:0,f:v=>v+'px'},
  ],
  draw(m,ctx,w,h,t){
    const P=m.P,cx=w/2,cy=h/2,R=Math.min(w,h)*.38;
    ctx.fillStyle='#050101';ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation='lighter';
    // dot grid
    ctx.fillStyle=C.red;ctx.globalAlpha=.5;const pt=P.pitch;
    for(let x=cx%pt;x<w;x+=pt)for(let y=cy%pt;y<h;y+=pt)ctx.fillRect(x-.6,y-.6,1.3,1.3);
    // axes
    ctx.globalAlpha=1;ctx.strokeStyle=C.red;glow(ctx,C.red,.8);ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(w,cy);ctx.moveTo(cx,0);ctx.lineTo(cx,h);ctx.stroke();
    // unit circle + constant-resistance circles
    const geo=(k,n)=>Math.exp(Math.log(.2)+(Math.log(5)-Math.log(.2))*(n>1?k/(n-1):0));
    const rp=new Path2D();rp.arc(cx,cy,R,0,TAU);
    for(let k=0;k<P.rings;k++){const r=geo(k,P.rings),rad=R/(1+r),ccx=cx+R*r/(1+r);rp.moveTo(ccx+rad,cy);rp.arc(ccx,cy,rad,0,TAU)}
    ctx.lineWidth=1.25;ctx.stroke(rp);
    // constant-reactance arcs: faint full circles, then bright inside the chart
    const xp=new Path2D();
    for(let k=0;k<P.arcs;k++){const x=geo(k,P.arcs),rad=R/x;for(const sg of[-1,1]){const yc=cy+sg*rad;xp.moveTo(cx+R+rad,yc);xp.arc(cx+R,yc,rad,0,TAU)}}

    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.clip();ctx.globalAlpha=.85;ctx.lineWidth=1.2;ctx.stroke(xp);ctx.restore();
    // off-chart admittance sweeps from the short-circuit point
    ctx.globalAlpha=.55;ctx.beginPath();[1.45,1.9,2.6].forEach(q=>{const rad=R*q;ctx.moveTo(cx-R+rad*2,cy);ctx.arc(cx-R+rad,cy,rad,0,TAU)});ctx.stroke();
    // labels
    ctx.shadowBlur=0;ctx.globalAlpha=.85;ctx.fillStyle=C.red;ctx.font='500 10px "IBM Plex Mono",monospace';
    ctx.fillText('Z₀ 50Ω',cx+6,cy-6);ctx.fillText('SC',cx-R-20,cy-6);ctx.fillText('OC',cx+R+5,cy-6);
    // beam
    const T=.6+P.persist*4,Sn=220,pts=[];
    for(let i=0;i<=Sn;i++){const tau=t-T*(1-i/Sn),ph=tau*P.phase;
      let x=Math.sin(P.fa*tau*1.1+ph),y=Math.sin(P.fb*tau*1.1);
      const dx=x*Math.sqrt(1-y*y/2),dy=y*Math.sqrt(1-x*x/2);pts.push([dx*P.amp,dy*P.amp])}
    const chunks=10;ctx.lineWidth=1.8;ctx.lineCap='round';
    for(let c=0;c<chunks;c++){const a0=Math.floor(c*Sn/chunks),a1=Math.floor((c+1)*Sn/chunks),k=(c+1)/chunks;
      ctx.globalAlpha=k*k;ctx.strokeStyle=k>.8?C.phos:C.orange;glow(ctx,C.orange,1.1);

    const mag=Math.hypot(gx,gy);m.stats={mag,ang:Math.atan2(gy,gx)*180/Math.PI,vswr:mag<.999?(1+mag)/(1-mag):Infinity};
  },
  readout:m=>{const s=m.stats;if(s.mag==null)return'';
    return`<span>|Γ| ${s.mag.toFixed(2)} ∠ ${s.ang>=0?'+':''}${s.ang.toFixed(0)}&deg;</span><span>VSWR ${isFinite(s.vswr)?s.vswr.toFixed(2):'∞'}</span><span>${m.P.fa}:${m.P.fb}</span>`}
});

defineModule({
  id:'field',name:'Cell field',code:'F-05/CEL',ch:'CH5 · Dot lattice',acc:'var(--mint)',
  params:[
    {k:'pitch',label:'Dot pitch',min:7,max:22,step:1,v:11,d:0,f:v=>v+'px'},
    {k:'size',label:'Void size',min:.15,max:.6,v:.36},

    {k:'rim',label:'Rim width',min:.5,max:4,v:2,d:1},

    {k:'speed',label:'Flow',min:0,max:1.5,v:.35},
  ],
  init(m){m.noise=makeNoise(9173)},
  draw(m,ctx,w,h,t){
    const P=m.P,nz=m.noise,pt=P.pitch,tt=t*P.speed*.45;
    ctx.fillStyle='#010605';ctx.fillRect(0,0,w,h);

window.PHOSPHOR={
  channels:()=>modules.map(m=>({id:m.id,name:m.name,params:m.params.map(p=>({k:p.k,min:p.min,max:p.max,value:m.P[p.k]}))})),
  set(id,k,v){const m=modules.find(x=>x.id===id);if(m&&m.sliders[k])m.sliders[k].set(v)},
  get(id,k){const m=modules.find(x=>x.id===id);return m?m.P[k]:undefined},
  stats(id){const m=modules.find(x=>x.id===id);return m?{...m.stats}:undefined}
};

/* ---------- CRT rack ---------- */
const crtRack=document.getElementById('crtRack'),root=document.documentElement;
const applyG=()=>{root.style.setProperty('--scan',G.scan);root.style.setProperty('--vig',G.vig);
  document.body.classList.toggle('crt-off',!G.crt);document.body.classList.toggle('flicker',G.flicker);
  document.getElementById('crtToggle').setAttribute('aria-pressed',G.crt);document.getElementById('flickToggle').setAttribute('aria-pressed',G.flicker);
  modules.forEach(m=>m.dirty=true)};
[{k:'scan',label:'Scanlines'},{k:'bloom',label:'Bloom'},{k:'noise',label:'Grain'},{k:'vig',label:'Vignette'}].forEach(p=>
  makeSlider(crtRack,'crt-'+p.k,{...p,min:0,max:1,v:G[p.k],f:v=>Math.round(v*100)+'%'},v=>{G[p.k]=v;applyG();saveG()}));
document.getElementById('crtToggle').onclick=()=>{G.crt=!G.crt;applyG();saveG()};
document.getElementById('flickToggle').onclick=()=>{G.flicker=!G.flicker;applyG();saveG()};

/* ---------- global controls ---------- */
const chips=document.getElementById('chips');
modules.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.style.setProperty('--acc',m.color);b.innerHTML=`<i></i>${pad(i+1)} ${m.name}`;b.title='Start or stop '+m.name;
  b.onclick=()=>setRun(m,!m.on);chips.appendChild(b);m.chip=b;setRun(m,m.on,true)});
document.getElementById('allOn').onclick=()=>modules.forEach(m=>setRun(m,true));
document.getElementById('allOff').onclick=()=>modules.forEach(m=>setRun(m,false));
const pauseBtn=document.getElementById('pauseAll'),stateEl=document.getElementById('state');
const syncPause=()=>{pauseBtn.textContent=G.paused?'Resume':'Pause';stateEl.textContent=G.paused?'HOLD':'RUN';document.body.classList.toggle('paused',G.paused)};
pauseBtn.onclick=()=>{G.paused=!G.paused;syncPause()};
document.getElementById('randAll').onclick=()=>modules.forEach(randomize);
syncPause();applyG();
if(document.fonts)document.fonts.ready.then(()=>modules.forEach(m=>m.dirty=true));

/* ---------- loop ---------- */
const clk=document.getElementById('clk'),fpsEl=document.getElementById('fps');
let last=performance.now(),acc=0,frames=0,roT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const m of modules){if(!m.visible||!m.w)continue;
    const run=!G.paused&&m.on;if(run)m.t+=dt;
    if(run||m.dirty){render(m,run?dt:0);m.dirty=false}}
  frames++;acc+=dt;roT+=dt;
  if(acc>=.5){fpsEl.textContent=G.paused?'-- fps':Math.round(frames/acc)+' fps';frames=0;acc=0;clk.textContent=new Date().toLocaleTimeString('en-GB')}
  if(roT>=.25){roT=0;for(const m of modules)m.ro.innerHTML=m.readout(m)}
  requestAnimationFrame(frame);
}
clk.textContent=new Date().toLocaleTimeString('en-GB');
requestAnimationFrame(frame);
})();
</script>

</body></html>
