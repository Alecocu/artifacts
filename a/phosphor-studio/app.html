<!DOCTYPE html>
<html lang="en">
<head><script>/* Stand-in for Claude's artifact runtime, so pages built for claude.ai work on a plain website.
   - 'downloads' saves files with a normal browser download.
   - Every other capability (shared database, user, AI sampling...) answers null, which each page
     already treats as "not available here" and falls back to its local mode. */
(function () {
  if (window.claude && typeof window.claude.use === 'function') return;
  function toBlob(data, filename) {
    if (data instanceof Blob) return data;
    if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) return new Blob([data]);
    var type = /\.json$/i.test(filename) ? 'application/json' : 'text/plain';
    return new Blob([typeof data === 'string' ? data : JSON.stringify(data, null, 2)], { type: type });
  }
  var downloads = {
    save: function (opts) {
      opts = opts || {};
      var name = opts.filename || 'download';
      var url = URL.createObjectURL(toBlob(opts.data, name));
      var a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      return Promise.resolve({ ok: true });
    }
  };
  window.claude = {
    standalone: true,
    use: function (name) { return Promise.resolve(name === 'downloads' ? downloads : null); }
  };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phosphor Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* VOICE: an instrument bench — terse, technical, every control live.
   IDEA: a vector-monitor workstation where the CRT is the canvas and the rack is the patchbay.
   PICTURE: the live viewport, glowing wire geometry over black glass, takes the centre.
   COLOUR and TYPE: black glass, mint phosphor, red/amber/violet channel accents; Big Shoulders + IBM Plex Mono.
   LAYOUT: toolbar / outliner · viewport · inspector / patch rack tabs along the bottom. */
:root{
  --bg:#060709;--panel:#0b0c10;--panel2:#0f1116;--rule:#20232b;--rule-hi:#3a3f4c;--black:#000;
  --fg:#d8dae3;--dim:#7a7f90;--red:#ff3d2e;--orange:#ff8a3d;--mint:#3df0b4;--phos:#ece8ff;--violet:#9a80ff;
  --blue:#6aa8ff;--yellow:#ffd23a;--cyan:#3fd8ff;--amber:#ffb43a;--magenta:#e050ff;--lime:#c6ff3d;
  --acc:var(--mint);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bh:280px;--lw:212px;--rw:330px;
  color-scheme:dark;
}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--fg);height:100%}
body{font:12px/1.45 var(--mono);display:grid;grid-template-rows:auto minmax(0,1fr) var(--bh);height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px dashed var(--acc);outline-offset:2px}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:6px;margin-right:4px}
.brand b{font:800 24px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--red);text-shadow:0 0 16px rgba(255,61,46,.45)}
.brand span{font:800 24px/1 var(--display);text-transform:uppercase;color:var(--phos);text-shadow:0 0 16px rgba(236,232,255,.3)}
.brand small{color:var(--dim);font-size:10px}
.led{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);align-self:center}
body.playing .led{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp+.grp{padding-left:10px;border-left:1px solid var(--rule)}
.sp{flex:1}
.btn{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--rule-hi);padding:7px 9px;cursor:pointer;border-radius:2px;white-space:nowrap;color:var(--fg);min-height:30px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{background:var(--rule)}
.btn.on,.btn[aria-pressed=true]{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn.pri{border-color:var(--mint);color:var(--mint)}
.btn.rec.on{border-color:var(--red);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.btn.sm{padding:4px 6px;min-height:24px;font-size:10px}
.btn.x{border-color:transparent;color:var(--dim)}.btn.x:hover{color:var(--red);border-color:var(--red)}
.tele{display:flex;gap:14px;margin:0}
.tele div{display:flex;flex-direction:column}
.tele dt{font-size:9px;letter-spacing:.14em;color:var(--dim)}
.tele dd{margin:0;font-variant-numeric:tabular-nums;min-width:6ch}
.top .pname{background:transparent;border:1px solid var(--rule);padding:6px 8px;width:17ch;border-radius:2px;min-height:30px}
.pname:focus{border-color:var(--acc)}

/* ---------- middle ---------- */
.mid{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--rule);display:flex;flex-direction:column}
.right{border-left:1px solid var(--rule)}
h3{margin:0;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px;justify-content:space-between}
.sec{padding:10px;border-bottom:1px solid var(--rule)}
.addgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:8px}
.addgrid button{background:var(--panel2);border:1px solid var(--rule);border-radius:2px;padding:4px 4px;min-height:27px;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden}
.addgrid button i{font-style:normal;font-size:13px;width:14px;text-align:center;flex:none;line-height:1;color:var(--c,var(--mint));text-shadow:0 0 6px var(--c,var(--mint))}
.addgrid button:hover{border-color:var(--c,var(--mint));color:var(--fg)}
.outl{flex:1;display:flex;flex-direction:column;min-height:0}
.outl input{width:100%;margin-top:8px}
#outliner{list-style:none;margin:8px 0 0;padding:0;overflow:auto;flex:1}
#outliner li{display:grid;grid-template-columns:18px 14px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 6px;border:1px solid transparent;border-radius:2px;cursor:pointer}
#outliner li:hover{background:var(--panel2)}
#outliner li.sel{border-color:var(--acc);background:#0e1714}
#outliner li .ic{color:var(--c);text-shadow:0 0 5px var(--c);text-align:center}
#outliner li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#outliner li .meta{color:var(--dim);font-size:9.5px}
#outliner li.hid .nm{color:var(--dim);text-decoration:line-through}
#outliner li.tpl .nm{font-style:italic;color:var(--violet)}
.eye{background:none;border:0;cursor:pointer;color:var(--dim);padding:0;font-size:11px}
.eye.on{color:var(--fg)}

/* ---------- viewport ---------- */
.view{position:relative;background:#000;overflow:hidden;min-height:0;touch-action:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;pointer-events:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint);text-shadow:0 0 6px var(--mint);font-variant-numeric:tabular-nums}
.hud.tl{top:10px;left:12px}.hud.tr{top:10px;right:12px;text-align:right}.hud.bl{bottom:9px;left:12px;color:var(--dim);text-shadow:none;text-transform:none;letter-spacing:0}
.hud.br{bottom:9px;right:12px;color:var(--red);text-shadow:0 0 6px var(--red)}
.vtools{position:absolute;z-index:4;top:34px;left:10px;display:flex;flex-direction:column;gap:4px}
.vtools .btn{background:rgba(6,7,9,.7);min-width:32px;padding:6px}

/* ---------- inspector ---------- */
.insp-empty{padding:18px 14px;color:var(--dim);line-height:1.6}
.insp-empty b{color:var(--fg);font-weight:500}
details{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;list-style:none;padding:9px 12px;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--rule-hi)}
details[open]>summary::after{content:"\2212"}
details[open]>summary{color:var(--acc)}
.body{padding:0 12px 12px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:6px;align-items:center}
.row>label,.lab{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.row>label.scrub{cursor:ew-resize}
.row>label.scrub:hover{color:var(--acc)}
.v3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.v3 input{text-align:right}
input[type=number],input[type=text],input:not([type]),select,textarea{background:var(--black);border:1px solid var(--rule);border-radius:2px;padding:5px 6px;min-height:26px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.35}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
textarea{resize:vertical;min-height:80px;line-height:1.45;tab-size:2;white-space:pre}
textarea.code{font-size:11.5px;color:#cfe9df}
input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:26px;border:1px solid var(--rule);background:var(--black);padding:2px;border-radius:2px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:1px}
input[type=checkbox]{accent-color:var(--mint);width:15px;height:15px}
input[type=range]{width:100%;accent-color:var(--mint)}
.modb{background:none;border:1px solid transparent;color:var(--rule-hi);cursor:pointer;padding:0 3px;font-size:12px;line-height:1;min-height:20px;border-radius:2px}
.modb:hover{color:var(--violet);border-color:var(--violet)}
.modb.has{color:var(--violet)}
.card{border:1px solid var(--rule);background:var(--panel2);border-radius:2px;padding:8px;display:grid;gap:6px}
.card header{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card header b{font-weight:500;color:var(--acc)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.f{display:grid;gap:3px}
.f>span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.note{color:var(--dim);font-size:10.5px;line-height:1.5}
.note code,.ref code{color:var(--mint)}

/* ---------- bottom rack ---------- */
.bottom{display:grid;grid-template-rows:auto auto minmax(0,1fr);border-top:1px solid var(--rule);background:var(--panel);min-height:0}
.resizer{height:5px;cursor:ns-resize;background:linear-gradient(var(--rule),var(--rule)) center/40px 1px no-repeat}
.resizer:hover{background:linear-gradient(var(--acc),var(--acc)) center/60px 1px no-repeat}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px 7px;cursor:pointer;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.tabs button em{font-style:normal;color:var(--violet);margin-left:4px}
.tabbody{overflow:auto;padding:10px 12px;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.toolbar .f{min-width:80px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;align-items:start}
.meter{height:4px;background:var(--rule);position:relative;overflow:hidden;border-radius:1px}
.meter i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.meter.uni i{left:0}
table.mx{width:100%;border-collapse:collapse}
table.mx th{font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 4px 6px;border-bottom:1px solid var(--rule)}
table.mx td{padding:4px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.mx td.n{width:76px}
table.mx .meter{width:70px}
.mx-wrap{overflow-x:auto}
.seq{display:grid;gap:4px}
.trk{display:grid;grid-template-columns:150px 112px 62px 46px minmax(0,1fr);gap:6px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(var(--n,16),minmax(14px,1fr));gap:3px}
.steps button{height:24px;border:1px solid var(--rule-hi);background:var(--black);border-radius:2px;cursor:pointer;padding:0;position:relative}
.steps button:nth-child(4n+1){border-color:#545a6a}
.steps button[data-v]:not([data-v="0"]){background:var(--acc);box-shadow:0 0 6px var(--acc)}
.steps button[data-v="0.5"]{opacity:.55}
.steps button.ph{outline:1px solid var(--phos);outline-offset:1px}
.trk.mute .steps{opacity:.35}
.ref{columns:2 320px;column-gap:24px;color:var(--dim);font-size:11px;line-height:1.6}
.ref p{margin:0 0 6px;break-inside:avoid}
.log{font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.log .e{color:var(--red)}.log .w{color:var(--amber)}.log .i{color:var(--mint)}
.dtab{max-height:180px;overflow:auto;border:1px solid var(--rule)}
.dtab table{border-collapse:collapse;font-size:11px}
.dtab td,.dtab th{padding:3px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.dtab th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-weight:500}
.dtab tr.cur td{color:var(--mint)}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--rule-hi);border-radius:3px;width:min(720px,100%);max-height:88vh;display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox>header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.mbox>header b{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--mint)}
.mbody{overflow:auto;padding:14px;display:grid;gap:12px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tpls button{text-align:left;background:var(--panel2);border:1px solid var(--rule);border-radius:2px;padding:10px;cursor:pointer;display:grid;gap:4px}
.tpls button:hover{border-color:var(--acc)}
.tpls b{font:800 18px/1 var(--display);text-transform:uppercase;color:var(--acc);letter-spacing:.03em}
.tpls span{color:var(--dim);font-size:10.5px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(var(--bh) + 14px);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--acc);padding:7px 12px;border-radius:2px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
kbd{font:inherit;border:1px solid var(--rule-hi);border-bottom-width:2px;padding:0 4px;border-radius:2px;color:var(--fg)}

@media (max-width:1100px){:root{--lw:180px;--rw:290px}}
@media (max-width:1380px){.tele{display:none}}
@media (max-width:860px){
  body{height:auto;overflow:auto;grid-template-rows:auto auto auto}
  .mid{grid-template-columns:minmax(0,1fr)}
  .view{height:58vh;order:-1}
  .left{max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  #outliner{max-height:220px}
  .right{border-left:0}
  .bottom{min-height:70vh}
  .resizer{display:none}
  .trk{grid-template-columns:1fr 1fr;}
  .trk .steps{grid-column:1/-1}
  .split{grid-template-columns:minmax(0,1fr)}
  .toast{bottom:20px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="led"></span><b>Phosphor</b><span>Studio</span><small>v0</small></div>
  <div class="grp">
    <button class="btn pri" id="bPlay" type="button" title="Play / pause (Space)">&#9654; Play</button>
    <button class="btn" id="bStop" type="button" title="Stop and reset to the edit state">&#9632; Stop</button>
    <button class="btn" id="bStep" type="button" title="Advance one frame">Step</button>
  </div>
  <div class="grp" id="toolsGrp">
    <button class="btn" data-tool="hand" type="button" title="Interact: click and grab objects while running (H)">Hand</button>
    <button class="btn" data-tool="move" type="button" title="Move (W)">Move</button>
    <button class="btn" data-tool="rotate" type="button" title="Rotate (E)">Rotate</button>
    <button class="btn" data-tool="scale" type="button" title="Scale (R)">Scale</button>
    <button class="btn" data-tool="pen" type="button" title="Draw a path on the view plane (P)">Pen</button>
    <button class="btn" id="bSnap" type="button" aria-pressed="false" title="Snap to grid / 15&deg;">Snap</button>
  </div>
  <div class="grp">
    <button class="btn" data-view="persp" type="button" title="Perspective (1)">Persp</button>
    <button class="btn" data-view="top" type="button" title="Top (2)">Top</button>
    <button class="btn" data-view="front" type="button" title="Front (3)">Front</button>
    <button class="btn" data-view="side" type="button" title="Side (4)">Side</button>
    <button class="btn" id="bOrtho" type="button" aria-pressed="false" title="Orthographic (5)">Ortho</button>
  </div>
  <div class="grp">
    <button class="btn" id="bUndo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="bRedo" type="button" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>
  <div class="sp"></div>
  <div class="grp">
    <input class="pname" id="pName" aria-label="Project name" spellcheck="false">
    <button class="btn" id="bProject" type="button">Project</button>
    <button class="btn" id="bShot" type="button" title="PNG snapshot">PNG</button>
    <button class="btn rec" id="bRec" type="button" title="Record video with audio">Rec</button>
    <button class="btn" id="bModules" type="button" title="Turn optional tool sets on or off">Modules</button>
    <button class="btn" id="bHelp" type="button">Help</button>
  </div>
  <dl class="tele"><div><dt>FPS</dt><dd id="tFps">--</dd></div><div><dt>TIME</dt><dd id="tTime">0.0</dd></div><div><dt>BODIES</dt><dd id="tBodies">0</dd></div></dl>
</header>

<main class="mid">
  <aside class="left">
    <section class="sec"><h3>Add <span>click to place</span></h3><div class="addgrid" id="addGrid"></div></section>
    <section class="sec outl"><h3>Scene <span id="objCount"></span></h3><input id="filter" placeholder="Filter objects" aria-label="Filter objects"><ul id="outliner"></ul></section>
  </aside>
  <section class="view" id="view">
    <canvas id="cv"></canvas>
    <div class="hud tl" id="hudTL"></div>
    <div class="hud tr" id="hudTR"></div>
    <div class="hud bl" id="hudBL"></div>
    <div class="hud br" id="hudBR"></div>
  </section>
  <aside class="right" id="inspector"></aside>
</main>

<section class="bottom" id="bottom">
  <div class="resizer" id="resizer" title="Drag to resize"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tabbody" id="tabbody"></div>
</section>

<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><header><b id="mTitle"></b><button class="btn x" id="mClose" type="button" aria-label="Close">&times;</button></header><div class="mbody" id="mBody"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>
<script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
<script>
{
'use strict';
const PAGE_SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const uid = () => Math.random().toString(36).slice(2, 9);

        <div class="g2">${this.field('When', this.sel_(r, 'on', t.on, Object.fromEntries(Object.entries(TRIG_ON).filter(([k]) => k === t.on || M(MOD_OF_ON[k])).map(([k, v]) => [k, v.split(' (')[0]]))))}${this.field(t.on === 'threshold' ? 'Signal' : 'Arg', this.txt(r, 'arg', t.arg, { list: t.on === 'threshold' ? 'srcList' : '', ph: ((TRIG_ON[t.on] || '').match(/\((.*)\)/) || [])[1] || '' }))}</div>

        ${this.field('Then', this.sel_(r, 'act', t.act, Object.fromEntries(Object.entries(TRIG_ACT).filter(([k]) => k === t.act || M(MOD_OF_ACT[k])))))}${af}</div>`;

/* ---------- capabilities ---------- */
const CAP = { downloads: null, sample: null };
async function saveFile(name, data) {
  if (CAP.downloads) { try { await CAP.downloads.save({ filename: name, data }); UI.toast('Saved ' + name); return true; } catch (e) { if (e && e.code === 'declined') return false; LOG.warn('Download failed: ' + (e.message || e.code)); } }
  // fallback: preview / copy
  if (data instanceof Blob && /^image|^video/.test(data.type)) { const u = URL.createObjectURL(data); UI.modal('Export', data.type.startsWith('image') ? `<img src="${u}" style="width:100%;border:1px solid var(--rule)"><div class="note">Right-click the image to save it.</div>` : `<video src="${u}" controls style="width:100%"></video><div class="note">Use the video menu to save it.</div>`); return false; }
  const txt = typeof data === 'string' ? data : await data.text?.() || '';
  UI.modal('Export', `<div class="note">Downloads are not available in this view. Copy the contents instead.</div><textarea class="code" rows="14" readonly>${esc(txt.slice(0, 2e6))}</textarea><button class="btn" id="cpyBtn" type="button">Copy</button>`);
  $('#cpyBtn').onclick = () => navigator.clipboard.writeText(txt).then(() => UI.toast('Copied'), () => UI.toast('Copy refused — select the text and copy'));
  return false;
}

/* ---------- recording ---------- */
const REC = {
  on: false, t0: 0, mr: null, chunks: [],
  toggle() {
    if (this.on) { this.mr.stop(); return; }
    if (!window.MediaRecorder || !R.cv.captureStream) { UI.toast('Recording is not supported in this browser'); return; }
    AUD.init();
    const vs = R.cv.captureStream(60), tracks = [...vs.getVideoTracks()]; if (AUD.recDest) tracks.push(...AUD.recDest.stream.getAudioTracks());
    const st = new MediaStream(tracks), types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'], mt = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    try { this.mr = new MediaRecorder(st, mt ? { mimeType: mt, videoBitsPerSecond: 8e6 } : {}); } catch (e) { UI.toast('Recorder failed: ' + e.message); return; }
    this.chunks = []; this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.onstop = () => { this.on = false; R.rec = false; $('#bRec').classList.remove('on'); const b = new Blob(this.chunks, { type: 'video/webm' }); saveFile((P().name || 'phosphor') + '.webm', b); UI.refreshTab(); };
    this.mr.start(250); this.on = true; this.t0 = performance.now(); R.rec = true; $('#bRec').classList.add('on'); UI.toast('Recording — press Rec again to stop'); if (UI.tab === 'io') UI.refreshTab();
  }
};
async function snapshot() { R.rec = true; R.frame(); R.rec = false; R.cv.toBlob(b => b && saveFile((P().name || 'phosphor') + '.png', b), 'image/png'); }
function exportHTML() {
  const json = JSON.stringify(P()).replace(/</g, '\\u003c');
  let src = PAGE_SRC.replace(/<script id="bootProject"[^>]*>[\s\S]*?<\/script>/, '');
  src = src.replace(/<body[^>]*>/, m => m + `<script id="bootProject" type="application/json">${json}<\/script>`);
  saveFile((P().name || 'phosphor').replace(/[^\w\- ]+/g, '') + '.html', src);
}

function genFromData(kind, valCol, labCol, H = 4, silent) {
  const n = DATA.rows.length; if (!n) { UI.toast('No data rows'); return; }
  const O = P().objects, step = Math.min(.9, 10.5 / n), x0 = -(n - 1) * step / 2, made = [];
  const lab = labCol && labCol !== '(none)' ? labCol : null;
  if (kind === 'bars') {
    for (let i = 0; i < n; i++) { const v = DATA.norm(valCol, i), h = Math.max(.03, v * H); made.push(makeObj('box', { name: uniqueName('Bar ' + (i + 1)), pos: [x0 + i * step, h / 2, 0], shape: { w: step * .72, h, d: step * .72 }, look: { stroke: hsl2hex(160 - v * 150, 95, 60), style: 'solid' } })); }
    if (lab) for (let i = 0; i < n; i++) made.push(makeObj('text', { name: uniqueName('Label ' + (i + 1)), pos: [x0 + i * step, -.3, step * .5], shape: { text: String(DATA.get(lab, i)), size: Math.min(.24, step * .32), font: 'mono' }, look: { stroke: '#7a7f90' } }));
  } else if (kind === 'line') {
    made.push(makeObj('path', { name: uniqueName('Line ' + valCol), pos: [0, 0, -.6], shape: { closed: false, smooth: 1, pts: Array.from({ length: n }, (_, i) => [x0 + i * step, DATA.norm(valCol, i) * H, 0]) }, look: { stroke: '#3fd8ff', width: 1.6, glow: 1.2 } }));
  } else if (kind === 'ring') {
    made.push(makeObj('path', { name: uniqueName('Radial ' + valCol), pos: [0, H / 2 + .5, 0], shape: { closed: true, smooth: 1, pts: Array.from({ length: n }, (_, i) => { const a = TAU * i / n - Math.PI / 2, r = .8 + DATA.norm(valCol, i) * H * .45; return [Math.cos(a) * r, -Math.sin(a) * r, 0]; }) }, look: { stroke: '#e050ff', width: 1.5 } }));
    made.push(makeObj('ring', { name: uniqueName('Radial base'), pos: [0, H / 2 + .5, 0], shape: { r: .8, ticks: n, tick: .1 }, look: { stroke: '#7a7f90', alpha: .7 } }));
  } else if (kind === 'scatter') {
    const nc = DATA.cols.filter((c, i) => DATA.num[i]); const [cx, cy, cz] = [nc[0], nc[1], nc[2] || nc[0]];
    for (let i = 0; i < n; i++) made.push(makeObj('sphere', { name: uniqueName('Point ' + (i + 1)), pos: [(DATA.norm(cx, i) - .5) * 6, .3 + DATA.norm(cy, i) * H, (DATA.norm(cz, i) - .5) * 6], shape: { r: .09, lat: 5, lon: 8 }, look: { stroke: hsl2hex(200 + DATA.norm(cz, i) * 120, 90, 62) } }));
    made.push(makeObj('box', { name: uniqueName('Scatter frame'), pos: [0, .3 + H / 2, 0], shape: { w: 6, h: H, d: 6 }, look: { stroke: '#2a3a55', alpha: .7, dash: 4 } }));
  } else if (kind === 'sonify') {
    made.push(makeObj('empty', { name: uniqueName('Sonifier'), pos: [x0 - 1, .3, 0], look: { stroke: '#ffd23a' }, triggers: [TR({ on: 'beat', arg: '1', act: 'note', inst: 3, pitch: `scale(round(S("data.${valCol}")*10))`, vel: '.6', dur: '.4', cool: 0 })] }));
    P().data.rate = P().settings.bpm / 60; P().data.smooth = false;
  } else if (kind === 'cursor') {
    const c = makeObj('sphere', { name: uniqueName('Cursor'), pos: [x0, H + .4, 0], shape: { r: .14, lat: 6, lon: 10 }, look: { stroke: '#ece8ff', glow: 1.6 } });
    const t = makeObj('text', { name: uniqueName('Readout'), pos: [x0, H + .9, 0], shape: { text: lab ? `{D("${lab}")} · {D("${valCol}")}` : `{D("${valCol}")}`, size: .26, font: 'mono' }, look: { stroke: '#ece8ff' } });
    made.push(c, t);
    P().mods.push(MOD('data.row', c.id, 'pos.0', step, { mode: 'set', off: x0, smooth: .08 }), MOD('data.' + valCol, c.id, 'pos.1', H, { mode: 'set', off: .4, smooth: .08 }), MOD('data.row', t.id, 'pos.0', step, { mode: 'set', off: x0, smooth: .08 }), MOD('data.' + valCol, t.id, 'pos.1', H, { mode: 'set', off: .9, smooth: .08 }));
    if (!P().data.rate) P().data.rate = 1;
  }
  O.push(...made);
  if (!silent) { HIST.touch(); UI.renderOutliner(); UI.renderTab(); UI.toast(`Added ${made.length} object${made.length === 1 ? '' : 's'}`); }
}

const HIST = {
  stack: [], i: -1, timer: null,
  push() { const s = JSON.stringify(P()); if (this.stack[this.i] === s) return; this.stack = this.stack.slice(0, this.i + 1); this.stack.push(s); if (this.stack.length > 120) this.stack.shift(); this.i = this.stack.length - 1; try { localStorage.setItem('phosphor-studio-auto', s); } catch (e) { } },
  touch() { clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 350); },
  undo() { this.push(); if (this.i > 0) { this.i--; this.restore(); } }, redo() { if (this.i < this.stack.length - 1) { this.i++; this.restore(); } },
  restore() { stopRun(); PROJ = JSON.parse(this.stack[this.i]); try { localStorage.setItem('phosphor-studio-auto', this.stack[this.i]); } catch (e) { } refreshAll(); }
};
function normalizeProject(p) {
  const b = baseProject(p.name || 'Untitled'); const out = merge(b, { ...p, objects: [], instruments: [], seq: {} });
  out.objects = (p.objects || []).map(sanitizeObj);
  out.instruments = (p.instruments && p.instruments.length ? p.instruments : defaultInstruments()).map(i => Object.assign(makeInst(i.kind || 'synth'), i));
  out.seq = { tracks: (p.seq?.tracks || blankTracks()).map(t => Object.assign({ name: 'Track', inst: 0, note: 60, steps: [], mute: false, gate: .8, prob: 1, vel: 1 }, t)) };
  out.seq.tracks.forEach(t => { while (t.steps.length < 32) t.steps.push(0); });
  out.signals = (p.signals || []).map(s => Object.assign({ id: uid(), name: 'sig' }, SIG_TYPES[s.type] ? SIG_TYPES[s.type]() : SIG_TYPES.lfo(), s));
  out.mods = (p.mods || []).map(m => Object.assign({ id: uid(), on: true, src: 'lfo1', dst: '', path: 'pos.1', amt: 1, off: 0, mode: 'add', curve: 'lin', smooth: 0 }, m));
  const inf = inferModules(out); out.settings.modules = Object.assign({}, out.settings.modules, Object.fromEntries(Object.keys(inf).map(k => [k, true])));
  return out;
}
function loadProject(p, keepHist) { stopRun(); PROJ = normalizeProject(p); UI.sel = null; DATA.parse(PROJ.data.text); if (!keepHist) { HIST.stack = []; HIST.i = -1; } HIST.push(); refreshAll(); }

  while (P().objects.some(x => V.len(V.sub(x.pos, o.pos)) < .05)) o.pos[0] += .6;
  P().objects.push(o); UI.select(o.id); HIST.touch(); syncAddToRun(o); return o;
}

      if (/^arrow/.test(k)) e.preventDefault();

      case 'space': e.preventDefault(); AUD.init(); togglePause(); break;

      case 'w': UI.setTool('move'); break; case 'e': UI.setTool('rotate'); break; case 'r': UI.setTool('scale'); break; case 'h': UI.setTool('hand'); break; case 'p': UI.setTool('pen'); break;
      case '1': setView('persp'); break; case '2': setView('top'); break; case '3': setView('front'); break; case '4': setView('side'); break; case '5': $('#bOrtho').click(); break;

    const mv = ev => { const v = v0 + Math.round((ev.clientX - x0) / 3) * st * (ev.shiftKey ? 10 : 1); inp.value = +v.toFixed(4); inp.dispatchEvent(new Event('input', { bubbles: true })); };

}
function pickFile(accept, cb) { const f = $('#fileIn'); f.accept = accept; f.value = ''; f.onchange = () => f.files[0] && cb(f.files[0]); f.click(); }

function helpModal() {
  UI.modal('How it works', `<div class="ref" style="color:var(--fg)">
  <p><b>Build</b> — add shapes from the palette, move them with <kbd>W</kbd> <kbd>E</kbd> <kbd>R</kbd> (drag an axis arrow to constrain), draw paths with <kbd>P</kbd>. Right-drag pans, left-drag on empty space orbits, the wheel zooms, <kbd>F</kbd> frames the selection, <kbd>1</kbd>–<kbd>4</kbd> switch views, <kbd>5</kbd> toggles orthographic.</p>

  <p><b>Physics</b> — set a body to Static, Dynamic or Kinematic. Joints hang bodies from world anchors or link them together (ball, hinge, distance, spring, lock). Attractors pull bodies and particles.</p>
  <p><b>Signals</b> — LFOs, envelopes, noise, random, followers, expressions and variables, plus built-ins: mouse, audio output, audio input, MIDI, data columns and object positions.</p>
  <p><b>Mod matrix</b> — route any signal to any numeric property: position, rotation, scale, line width, glow, hue, or a shape parameter. Add, multiply or set, with smoothing.</p>

  <p><b>Scripts</b> — each object can define <code>start</code>, <code>update</code>, <code>collide</code>, <code>click</code>, <code>beat</code>, <code>note</code> functions; the scene script adds global logic. See the Scene script tab for the API.</p>
  <p><b>Sound</b> — seven instruments (subtractive, FM, drums, tuned noise), a step sequencer, delay and reverb. <code>scale(i)</code> keeps notes in key.</p>
  <p><b>Modules</b> — Sound, Live inputs, Data, Particles, Joints, Scripting and Assist start hidden in a new project. Turn them on from the Modules button; templates switch on what they use.</p>
  <p><b>Shortcuts</b> — <kbd>Ctrl Z</kbd> undo · <kbd>Ctrl Shift Z</kbd> redo · <kbd>Ctrl D</kbd> duplicate · <kbd>Del</kbd> delete · <kbd>Ctrl S</kbd> save in browser · <kbd>Esc</kbd> deselect / stop.</p></div>`);

/* ---------- viewport ---------- */
function bindViewport() {
  const cv = $('#cv'); let drag = null;
  const loc = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const gzHit = (x, y) => { for (const g of R.gz || []) if (segDist(x, y, g.o[0], g.o[1], g.e[0], g.e[1]) < 8 && Math.hypot(x - g.o[0], y - g.o[1]) > 6) return g; return null; };
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { e.preventDefault(); const c = P().camera; c.dist = clamp(c.dist * Math.exp(e.deltaY * .0012), .8, 400); }, { passive: false });
  cv.addEventListener('dblclick', e => { const [x, y] = loc(e), d = R.hit(x, y); if (d) frameObj(d.defId); });
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); const [x, y] = loc(e); MOUSE.down = 1; const c = P().camera;
    const base = { x, y, cam: deep(c), moved: 0 };
    if (e.button === 1 || e.button === 2 || (e.button === 0 && e.shiftKey && UI.tool !== 'pen')) { drag = { ...base, mode: 'pan' }; return; }
    if (e.button === 0 && e.altKey) { drag = { ...base, mode: 'orbit' }; return; }
    if (UI.tool === 'pen') { const [ro, rd] = CAM.ray(x, y), h = rayPlane(ro, rd, c.target, V.mul(CAM.f, -1)); if (h) { UI.pen = [h]; drag = { ...base, mode: 'pen', plane: [...c.target] }; } return; }
    if (UI.tool === 'hand') {
      const d = R.hit(x, y);
      if (d && RT.running && d.ro) {
        const o = d.ro; o.def.triggers.forEach((tr, i) => { if (tr.on === 'click') fire(o, tr, i, {}); }); callHook(o, 'click'); BUS.emit('click:' + o.def.name, { name: o.name });
        if (o.body && o.body.type === CANNON.Body.DYNAMIC) { RT.grab = { o, t: [...o.pos] }; drag = { ...base, mode: 'grab', plane: [...o.pos] }; return; }
      } else if (d && !RT.running) UI.select(d.defId);
      drag = { ...base, mode: 'orbit', click: true }; return;
    }
    const g = gzHit(x, y), def = UI.def;
    if (g && def && !def.locked) { drag = { ...base, mode: 'axis', g, def, p0: [...def.pos], r0: [...def.rot], s0: [...def.scl] }; return; }
    const d = R.hit(x, y);
    if (d) {
      if (UI.sel !== d.defId) UI.select(d.defId); const dd = UI.def;
      if (dd && !dd.locked) { const [ro, rd] = CAM.ray(x, y); drag = { ...base, mode: 'free', def: dd, p0: [...dd.pos], r0: [...dd.rot], s0: [...dd.scl], h0: rayPlane(ro, rd, dd.pos, V.mul(CAM.f, -1)) }; }
      return;
    }
    drag = { ...base, mode: 'orbit', click: true };
  });
  cv.addEventListener('pointermove', e => {
    const [x, y] = loc(e); MOUSE.sx = x; MOUSE.sy = y; MOUSE.over = true; MOUSE.x = clamp(x / R.W * 2 - 1, -1, 1); MOUSE.y = clamp(1 - y / R.H * 2, -1, 1);
    if (!drag) { const g = gzHit(x, y); UI.gzHot = g ? g.i : -1; cv.style.cursor = g ? 'grab' : UI.tool === 'pen' ? 'crosshair' : UI.tool === 'hand' ? 'pointer' : 'default'; return; }
    const dx = x - drag.x, dy = y - drag.y, c = P().camera; drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    const snap = (v, s) => UI.snap ? Math.round(v / s) * s : v;
    switch (drag.mode) {
      case 'orbit': c.yaw = drag.cam.yaw - dx * .008; c.pitch = clamp(drag.cam.pitch + dy * .008, -1.56, 1.56); if (drag.moved > 3) UI.viewName = 'PERSP'; break;
      case 'pan': { const k = 1 / CAM.ppu(drag.cam.target); c.target = V.add(drag.cam.target, V.add(V.mul(CAM.r, -dx * k), V.mul(CAM.u, dy * k))); break; }
      case 'axis': {
        const g = drag.g, sd = [g.e[0] - g.o[0], g.e[1] - g.o[1]], sl = Math.hypot(sd[0], sd[1]) || 1, along = (dx * sd[0] + dy * sd[1]) / sl, units = along / (sl / g.L), d = drag.def, i = g.i;
        if (UI.tool === 'move') { d.pos = drag.p0.map((v, k) => k === i ? snap(v + units, .25) : v); }
        else if (UI.tool === 'rotate') { d.rot = drag.r0.map((v, k) => k === i ? snap(v + (dx - dy) * .6, 15) : v); }
        else { d.scl = drag.s0.map((v, k) => k === i ? snap(v * Math.exp(along * .01), .1) || .01 : v); }
        syncDef(d, true); refreshTransform(); break;
      }
      case 'free': {
        const d = drag.def;
        if (UI.tool === 'move') { const [ro, rd] = CAM.ray(x, y), h = rayPlane(ro, rd, drag.p0, V.mul(CAM.f, -1)); if (h && drag.h0) d.pos = V.add(drag.p0, V.sub(h, drag.h0)).map(v => snap(v, .25)); }
        else if (UI.tool === 'rotate') { d.rot = [snap(drag.r0[0] + dy * .6, 15), snap(drag.r0[1] + dx * .6, 15), drag.r0[2]]; }
        else if (UI.tool === 'scale') { const k = Math.exp((dx - dy) * .008); d.scl = drag.s0.map(v => snap(v * k, .1) || .01); }
        syncDef(d, true); refreshTransform(); break;
      }
      case 'grab': { const [ro, rd] = CAM.ray(x, y), h = rayPlane(ro, rd, drag.plane, V.mul(CAM.f, -1)); if (h && RT.grab) RT.grab.t = h; break; }

    }
  });
  const end = e => {
    MOUSE.down = 0; if (!drag) return; const d = drag; drag = null;
    if (d.mode === 'orbit' && d.click && d.moved < 4 && UI.tool !== 'hand') UI.select(null);
    if (d.mode === 'axis' || (d.mode === 'free' && d.moved > 1)) { HIST.touch(); if (RT.running) rebuildPhysicsFor(d.def); UI.renderInspector(); }
    if (d.mode === 'grab') RT.grab = null;
    if (d.mode === 'pen') { const pts = UI.pen || []; UI.pen = null; if (pts.length > 2) { const cx = pts.reduce((a, p) => V.add(a, p), [0, 0, 0]).map(v => v / pts.length); addObject('path', { pos: cx, shape: { pts: pts.map(p => V.sub(p, cx).map(v => +v.toFixed(3))), closed: V.len(V.sub(pts[0], pts[pts.length - 1])) < .3, smooth: 1 } }); UI.setTool('move'); } }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => { MOUSE.over = false; });
}
function refreshTransform() { const d = UI.def; if (!d) return; $$('#inspector input[data-r="obj"]').forEach(inp => { const k = inp.dataset.k; if (/^(pos|rot|scl)\.\d$/.test(k) && document.activeElement !== inp) inp.value = +(+getP(d, k)).toFixed(3); }); }

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  R.init($('#cv'));
  PROJ = baseProject('Untitled');
  bindAll(); UI.setTool('move');
  let start = null;
  const bootEl = document.getElementById('bootProject');
  if (bootEl) { try { start = JSON.parse(bootEl.textContent); } catch (e) { } }
  if (!start) { try { const s = localStorage.getItem('phosphor-studio-auto'); if (s) start = JSON.parse(s); } catch (e) { } }
  if (!start) start = TEMPLATES.bounce[2]();
  loadProject(start);
  setView('persp');
  if (!PHY.ok()) LOG.warn('cannon.js did not load — physics is disabled.');
  LOG.info('Phosphor Studio v0 ready. Press Play (Space). Help explains the controls.');
  let last = performance.now(), fa = 0, fn = 0;
  const loop = now => {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now; if (!(dt > 0)) dt = 0; if (dt > .1) dt = .1;
    fa += dt; fn++; if (fa > .5) { UI.fps = fn / fa; $('#tFps').textContent = UI.fps.toFixed(0); fa = 0; fn = 0; }
    if (MOUSE.over || RT.grab) { const [ro, rd] = CAM.ray(MOUSE.sx, MOUSE.sy), h = rayPlane(ro, rd, P().camera.target, V.mul(CAM.f, -1)); if (h) { MOUSE.wx = h[0]; MOUSE.wy = h[1]; MOUSE.wz = h[2]; } }
    try {
      if (RT.running && !RT.paused) simulate(dt * clamp(P().settings.timeScale ?? 1, 0, 8));
      else if (RT.stepOnce) { RT.stepOnce = false; if (!RT.running) { startRun(); RT.paused = true; SEQ.stop(); UI.syncTransport(); } simulate(1 / 60); }
    } catch (e) { logOnce('sim', 'Simulation error: ' + e.message); console.error(e); }
    try { R.frame(); } catch (e) { logOnce('frame', 'Render error: ' + e.message); console.error(e); }
    UI.liveTick();
  };
  requestAnimationFrame(loop);
  // capabilities (resolve later; null when unavailable)
  const caps = async () => {
    if (!window.claude || !window.claude.use) return false;
    try { CAP.downloads = await window.claude.use('downloads'); } catch (e) { }
    try { CAP.sample = await window.claude.use('sample'); } catch (e) { }
    UI.renderTabs(); return true;
  };
  let tries = 0; const tc = async () => { if (await caps()) return; if (++tries < 20) setTimeout(tc, 400); }; setTimeout(tc, 50);
  addEventListener('beforeunload', () => HIST.push());
}
window.PhosphorStudio = { P, RT, API, LOG, UI, SEQ, AUD, PART, DATA, BUS, TEMPLATES, loadProject, startRun, stopRun, R, CAM, MOUSE };
boot();
